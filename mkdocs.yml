site_name: Generative AI Use Case Studies
site_url: https://georgechengtai.github.io/Generative-AI-use-case-studies
nav:
  - Home: index.md
  - Catching up with Generative AI Development:
    - GPT-4o (OpenAI): gpt4o.md
    - Notable Flagship Models after GPT-4o: flagship-models.md
    - Multimodality: multimodality.md
    - AI-powered Avatars and Voice Cloning: aivideo.md
    - AI-powered Search Engines: search-engine.md
    - Scenario-based Learning with lifelike Virtual Characters: virtual-character.md
    - Personalised and Adaptive Learning: palearning.md
    - Literature Review: literature-review.md
    - For SEN (Special Educational Needs) students: sen.md
  - Discipline-Specific Studies:
    - Journalism and Communication: journalism-and-communication.md
    - Psychology: psychology.md
    - Social Work: social-work.md
    - Sociology: sociology.md
  - Functionalities and Applications:
    - Content Creation: content-creation.md
    - Grading and Feedback: grading-and-feedback.md
    - Virtual Patient Simulation: virtual-patient-simulation.md
    - AI mentors: mentor.md
  - Blog: blog.md
theme:
  name: material
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    # - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - search.sharing
    - navigation.footer
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
    logo: fontawesome/solid/robot
  favicon: images/favicon.png
  language: en
  font:
    text: false
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
plugins:
  - search
  - glightbox
  - git-revision-date
  # - privacy:
  #    log_level: error

extra:
  analytics:
    provider: google
    property: G-V49W4H5DHF
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback form</a>.

  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics:
        name: Google Analytics
        checked: true


# extra:
  social:
    - icon: material/video-vintage
      link: https://www.iorad.com/help-center/162026?roleId=11284
      name: Tutorial on Iorad
  generator: false

extra_css:
  - style.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: |
