site_name: Generative AI Use Case Studies
site_url: https://georgechengtai.github.io/Generative-AI-use-case-studies
nav:
  - Home: index.md
  - Catching up with Generative AI Development:
    - GPT-4o (OpenAI): gpt4o.md
    - Notable Flagship Models after GPT-4o: flagship-models.md
    - Multimodality: multimodality.md
    - AI-powered Avatars and Voice Cloning: aivideo.md
    - AI-powered Search Engines: search-engine.md
    - Scenario-based Learning with lifelike Virtual Characters: virtual-character.md
    - Personalised and Adaptive Learning: palearning.md
    - Literature Review: literature-review.md
    - For SEN (Special Educational Needs) students: sen.md
  - Discipline-Specific Studies:
    - Journalism and Communication: journalism-and-communication.md
    - Psychology: psychology.md
    - Social Work: social-work.md
    - Sociology: sociology.md
  - Functionalities and Applications:
    - Content Creation: content-creation.md
    - Grading and Feedback: grading-and-feedback.md
    - Virtual Patient Simulation: virtual-patient-simulation.md
    - AI mentors: mentor.md
  - Blog: blog.md
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - toc.follow
    # - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Switch to dark mode
      # primary: teal
      accent: purple 
    - scheme: slate 
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
      # primary: teal
      accent: lime

plugins:
  # - social
  - search
  - glightbox
  - git-revision-date

# extra:
  # - social:
  #   - icon: fontawesome/brands/github-alt
  #     link: 
  #   - icon: fontawesome/brands/facebook
  #     link: 

extra_css:
  - style.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

